[project]
name = "twitter-clone-api"
version = "1.0.0"
description = "FastAPI Twitter Clone"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.122.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.31.0",
    "alembic>=1.17.2",
    "python-dotenv>=1.2.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "celery>=5.6.0",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.20",
    "colorlog>=6.10.1",
    "kombu>=5.6.1",
    "faker>=40.35.0",
    "httpx2 (>=2.9.0,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.27.0",
    "pre-commit>=3.7.0",
    "ruff>=0.15.9",
    "mypy>=1.19.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic",
    "migrations",
    "dist",
    "media",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP",
]
ignore = ["E501"]  # line too long handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
exclude = [
    "alembic/",
    "scripts/",
    "dist/",
    "media/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "types-aiofiles (>=25.1.0.20260518,<26.0.0.0)",
]
